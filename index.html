<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ÚLTIMO SINAL — A ENTIDADE 108</title>
<meta name="description" content="Uma frequência esquecida. Três fragmentos. Um nome perdido há 43 anos. Sintonize.">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:title" content="ÚLTIMO SINAL">
<meta property="og:description" content="Nem toda transmissão deveria ter sido recebida. Sintonize as frequências e descubra o que aconteceu com Mara.">
<meta property="og:url" content="https://nightjq.github.io/ultimo-sinal/">
<meta property="og:image" content="https://nightjq.github.io/ultimo-sinal/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ÚLTIMO SINAL">
<meta name="twitter:description" content="Nem toda transmissão deveria ter sido recebida.">
<meta name="twitter:image" content="https://nightjq.github.io/ultimo-sinal/preview.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root{
  --bg:#000;
  --g:#39ff14;
  --g-dim:#1c8a0b;
  --g-faint:rgba(57,255,20,.14);
  --font:'VT323','Courier New',monospace;
  --mono:ui-monospace,'Courier New',monospace;
  --r:#c0392b;--line:#1c2a1c;--panel:#0b0e0b;--nav:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);color-scheme:dark}
body{
  margin:0;height:100%;background:var(--bg);color:var(--g);
  font-family:var(--font);font-size:22px;line-height:1.35;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}
#noise{position:fixed;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none;image-rendering:pixelated}
.scan{position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.35) 3px);
}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.85) 100%)}
main{
  position:relative;min-height:100%;max-width:34rem;margin:0 auto;
  padding:1.5rem 1.4rem 9.5rem;display:flex;flex-direction:column;justify-content:flex-start;gap:1rem;
}
.bars{display:inline-flex;align-items:flex-end;gap:3px;height:18px;margin-right:.5rem}
.bars i{width:5px;background:var(--g-dim);display:block}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:9px}.bars i:nth-child(3){height:13px}.bars i:nth-child(4){height:18px}
.on .bars i{background:var(--g);box-shadow:0 0 6px var(--g)}
h1{
  margin:0;font-weight:400;font-size:clamp(3.4rem,17vw,5.6rem);line-height:.92;letter-spacing:.04em;
  text-shadow:0 0 8px var(--g),0 0 28px rgba(57,255,20,.45);
  animation:flick 1.6s steps(1) 1;
}
@keyframes flick{0%{opacity:0}8%{opacity:1}12%{opacity:.2}18%{opacity:1}30%{opacity:.5}34%{opacity:1}100%{opacity:1}}
.tag{font-size:1.5rem;max-width:20ch;text-shadow:0 0 6px rgba(57,255,20,.5)}
button{
  font:inherit;font-size:1.9rem;letter-spacing:.2em;color:var(--g);background:transparent;
  border:2px solid var(--g);padding:.9rem 1rem;width:100%;min-height:56px;cursor:pointer;
  box-shadow:0 0 12px var(--g-faint),inset 0 0 12px var(--g-faint);
  text-shadow:0 0 6px var(--g);transition:background .15s,color .15s;
}
button:active{background:var(--g);color:#000;text-shadow:none}
@media (hover:hover){button:hover{background:var(--g);color:#000;text-shadow:none}}
button:focus-visible,.in:focus-visible{outline:3px solid #fff;outline-offset:4px}
button:disabled{opacity:.4;cursor:default;background:transparent;color:var(--g)}
.conn[hidden],.msg[hidden],.dial[hidden],#decoder[hidden]{display:none}
.meter{height:6px;background:var(--g-faint);margin:.6rem 0;overflow:hidden}
.meter b{display:block;height:100%;width:0;background:var(--g);box-shadow:0 0 8px var(--g)}
.msg{border-left:2px solid var(--g);padding-left:1rem;font-size:1.7rem;line-height:1.3;text-shadow:0 0 5px rgba(57,255,20,.55)}
.msg small{display:block;color:var(--g-dim);font-size:1.1rem;margin-bottom:.6rem;text-shadow:none}
.msg p{margin:0 0 .9rem}
.msg p.res{font-size:1.2rem;color:var(--g-dim);text-shadow:none;letter-spacing:.06em}
.cur::after{content:"█";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.start,.hero{transition:opacity .5s}
.gone{opacity:0;pointer-events:none;position:absolute;visibility:hidden}

@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

.dec{
  align-self:flex-start;width:auto;min-height:44px;padding:.4rem 0;border:0;box-shadow:none;
  font-size:1.1rem;letter-spacing:.2em;color:var(--g-dim);text-shadow:none;
}
.dec:active{background:transparent;color:var(--g);text-shadow:0 0 6px var(--g)}
@media (hover:hover){.dec:hover{background:transparent;color:var(--g);text-shadow:0 0 6px var(--g)}}
#decoder{display:flex;flex-direction:column;gap:1rem}
.frags{color:var(--g-dim);font-size:1.2rem;letter-spacing:.1em}
.row{display:flex;gap:.5rem}
.in{
  flex:1;min-width:0;font:inherit;font-size:1.6rem;color:var(--g);background:#021200;
  border:1px solid var(--g);border-radius:0;padding:.6rem .8rem;text-transform:uppercase;caret-color:var(--g);
}
.in::placeholder{color:var(--g-dim)}
.val{width:auto;flex:none;font-size:1.4rem;letter-spacing:.1em;padding:.6rem 1rem;min-height:50px}
.clue{display:inline-block;width:auto;min-height:44px;padding:.3rem .6rem;margin:0 0 .9rem;border:1px dashed var(--g-dim);box-shadow:none;font-size:1.2rem;letter-spacing:.06em;text-align:left;color:var(--g-dim);text-shadow:none;animation:pulse 1.6s steps(2) infinite}
.clue:active{background:var(--g-faint);color:var(--g);text-shadow:none}
@media (hover:hover){.clue:hover{background:var(--g-faint);color:var(--g);text-shadow:none}}
.clue.got{animation:none;border-style:solid;border-color:var(--g);color:var(--g);cursor:default}
.clue.got:hover{background:transparent}
@keyframes pulse{50%{border-color:var(--g);color:var(--g);text-shadow:0 0 6px var(--g)}}
#flash{position:fixed;inset:0;z-index:5;background:var(--g);opacity:0;pointer-events:none}
#flash.pop{animation:pop .5s ease-out 1}
@keyframes pop{0%{opacity:.4}100%{opacity:0}}
main.glitch{animation:jit .45s linear 1}
@keyframes jit{0%{transform:none}20%{transform:translate(-4px,1px);filter:brightness(2.4)}40%{transform:translate(4px,-1px)}60%{transform:translate(-2px,0);filter:brightness(1.6)}100%{transform:none;filter:none}}
.in.bad{border-color:#fff;box-shadow:0 0 12px #fff;animation:shake .35s linear 1}
.dec.hint{animation:pulse 1.2s steps(2) infinite}
.tools{display:flex;gap:1.4rem}
#files{display:flex;flex-direction:column;gap:.5rem}
#files[hidden]{display:none}
.fl{font-size:1.25rem;min-height:46px;padding:.4rem .8rem;text-align:left;letter-spacing:.04em;border:1px solid var(--g-dim);color:var(--g-dim);box-shadow:none;text-shadow:none}
.fl.open{color:var(--g);border-color:var(--g)}
.doc{border:1px dashed var(--g-dim);padding:.8rem 1rem;font-size:1.4rem}
.doc p{margin:0 0 .5rem}
.mural{color:var(--g-dim);font-size:1.15rem;line-height:1.4;border-top:1px solid var(--g-dim);padding-top:.6rem;margin-top:.5rem}
.mural div{margin-bottom:.4rem}.mural b{color:var(--g);font-weight:400}
#intf{position:fixed;inset:0;z-index:9;background:#000;display:flex;flex-direction:column;justify-content:center;gap:1rem;padding:2rem 1.5rem;color:#fff;font-size:1.9rem;text-shadow:0 0 8px #fff,3px 0 #f00,-3px 0 var(--g);animation:jit .45s linear 1;cursor:pointer}
#intf[hidden]{display:none}
@media (prefers-reduced-motion:reduce){h1{animation:none}.cur::after{animation:none}.fq.shake,.clue,.dec.hint,#flash.pop,main.glitch,.in.bad{animation:none}}

.sub{color:var(--g-dim);letter-spacing:.3em;font-size:1.4rem;margin:.6rem 0 1rem}
.board{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.chip{width:auto;min-height:44px;padding:.3rem .7rem;font-size:1.15rem;letter-spacing:.04em;border:1px solid var(--g-dim);background:#021200;box-shadow:none;text-shadow:none}
.chip.sel{background:var(--g);color:#000}
.neg{color:#c0392b;margin:.4rem 0 0}
.mural .lk{border-left:2px solid #c0392b;padding-left:.6rem}

.bgimg{position:fixed;inset:0;background:#000 center/cover;opacity:.2;filter:grayscale(.6) brightness(.8);pointer-events:none}
.pic{display:block;width:100%;max-height:34vh;object-fit:cover;margin:0 0 1rem;border:1px solid var(--g-dim);filter:grayscale(.45) contrast(1.15) brightness(.8);animation:pimg 1.2s steps(6) 1}
@keyframes pimg{0%{opacity:0}30%{opacity:.8}40%{opacity:.2}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.pic{animation:none}}

.tip{border:1px dashed var(--g);padding:.6rem .8rem;font-size:1.2rem;background:rgba(0,0,0,.75)}
.tip button{width:auto;min-height:40px;font-size:1.1rem;padding:.2rem .8rem;margin-top:.5rem}
.sndb{width:auto;min-height:36px;font-size:1rem;letter-spacing:.1em;padding:.1rem .6rem;margin-left:.6rem;border-width:1px;box-shadow:none}
.lab{display:block;color:var(--g-dim);font-size:1rem;letter-spacing:.12em;margin-bottom:.2rem}
body[data-v="arq"] .sv,body[data-v="inv"] .sv,body[data-v="dia"] .sv{display:none!important}
body:not([data-v="inv"]) #decoder{display:none!important}


.top{position:sticky;top:0;z-index:4;margin:-1.5rem -1.4rem 0;padding:.9rem 1.4rem .7rem;background:linear-gradient(#000 82%,rgba(0,0,0,0))}
.status{display:flex;align-items:center;justify-content:space-between;color:var(--g-dim);font-size:1.1rem;margin-bottom:.5rem}
.obj{display:flex;flex-direction:column;gap:.35rem;border:1px solid var(--line);background:var(--panel);padding:.5rem .8rem;font-size:1.1rem;line-height:1.25}
#intv{color:var(--r);letter-spacing:.1em;font-size:1.05rem}
.ibar{display:flex;align-items:center;gap:.6rem;color:var(--g-dim);font-size:.95rem;letter-spacing:.08em}
.itrack{flex:1;height:5px;background:var(--g-faint)}
.itrack b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g-dim),var(--r));transition:width .6s}
.radio{border:1px solid var(--line);background:linear-gradient(#0d120d,#050705);padding:1.1rem;box-shadow:inset 0 0 36px rgba(57,255,20,.06),0 0 0 3px #000,0 0 0 4px var(--line)}
.freq{font-size:clamp(3rem,15vw,4.4rem);line-height:1;text-align:center;color:var(--g);text-shadow:0 0 10px var(--g),0 0 30px rgba(57,255,20,.4);letter-spacing:.04em}
.scale{position:relative;height:30px;margin:.9rem 0 .2rem;background:repeating-linear-gradient(90deg,var(--g-dim) 0 1px,transparent 1px 8px) bottom/100% 8px no-repeat,repeating-linear-gradient(90deg,var(--g) 0 1px,transparent 1px 40px) bottom/100% 16px no-repeat}
.needle{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--r);box-shadow:0 0 8px var(--r)}
.sc-lab{display:flex;justify-content:space-between;color:var(--g-dim);font-size:1rem}
#log{color:var(--g-dim);font-size:1.15rem;text-align:center;min-height:1.5rem}
.dial{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.dial .lab{grid-column:1/-1;margin:0}
.fq{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;min-height:64px;padding:.55rem .8rem;font-size:1.5rem;letter-spacing:.04em;text-align:left;border:1px solid var(--line);color:var(--g-dim);background:var(--panel);box-shadow:none;text-shadow:none}
.fq span+span{font-size:.95rem;opacity:.85}
.fq.heard{color:var(--g);border-color:var(--g-dim)}
.fq.ready{color:var(--g);border-color:var(--g);animation:pulse 1.6s steps(2) infinite}
.fq.shake{animation:shake .35s linear 1}
.fq:active{background:var(--g-faint);color:var(--g)}
.start{position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + .8rem);z-index:5;max-width:34rem;margin:0 auto;padding:0 1.4rem}
.start button{font-size:2.1rem;min-height:64px;background:rgba(0,12,0,.92)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:#050605;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{position:relative;flex:1 1 0;min-width:0;max-width:11rem;width:auto;min-height:var(--nav);padding:.3rem .2rem;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;font-size:.95rem;letter-spacing:.02em;white-space:nowrap;color:var(--g-dim);background:transparent;box-shadow:none;text-shadow:none}
.nav button[data-n]:not([data-n="0"])::before{content:attr(data-n);position:absolute;top:5px;left:calc(50% + .5rem);min-width:1.2rem;padding:0 .3rem;background:var(--r);color:#fff;font-size:.9rem;line-height:1.2rem;text-shadow:none}
.nav button i{display:flex;height:24px}
.nav button.on{color:var(--g);background:var(--g-faint);box-shadow:inset 0 2px 0 var(--g)}
.nav button.hint{animation:pulse 1.2s steps(2) infinite}
.sec{margin:0;font-weight:400;font-size:1.6rem;letter-spacing:.14em;text-shadow:0 0 6px rgba(57,255,20,.5);border-bottom:1px solid var(--line);padding-bottom:.4rem}
.tabs{gap:.5rem}.tabs .chip{flex:1;text-align:center;min-height:48px}
.mural,.doc,.in,.chip,.fl{font-family:var(--mono)}
.doc{font-size:1rem;line-height:1.5}.mural{font-size:.95rem}.fl{font-size:.95rem;margin-bottom:.1rem}.chip{font-size:.85rem}
.fl.lock{opacity:.6}
.scan::after{content:"";position:absolute;left:0;right:0;top:-90px;height:90px;background:linear-gradient(transparent,rgba(57,255,20,.05),transparent);animation:roll 7s linear infinite}
@keyframes roll{to{transform:translateY(calc(100vh + 180px))}}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
main.vin{animation:vin .35s ease-out 1}
@media (hover:hover){.fq:hover{background:var(--g-faint);color:var(--g)}.nav button:hover{color:var(--g)}}
@media (min-width:900px){body{font-size:24px}main,.start{max-width:46rem}}
@media (prefers-reduced-motion:reduce){.scan::after,main.vin,.fq.ready,.nav button.hint{animation:none}}
</style>
</head>
<body>
<div class="bgimg" aria-hidden="true"></div>
<canvas id="noise" aria-hidden="true"></canvas>
<div class="scan" aria-hidden="true"></div>
<div class="vig" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>

<main id="app">
  <header class="top">
    <div class="status" aria-live="polite">
      <span><span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="st">sem sinal</span></span>
      <span><span id="clock">--:--</span><button class="sndb" id="snd" type="button">SOM</button></span>
    </div>
    <div class="obj" id="obj">
      <span id="intv"></span>
      <div class="ibar"><span id="ilab">INTERFERÊNCIA 0%</span><span class="itrack"><b id="ifill"></b></span></div>
      <div id="objt"></div>
    </div>
  </header>
  <div class="tip" id="tip" hidden></div>

  <section class="hero" id="hero">
    <h1>ÚLTIMO<br>SINAL</h1>
    <p class="sub">A ENTIDADE 108</p>
    <p class="tag">Nem toda transmissão deveria ter sido recebida.</p>
  </section>

  <section class="radio" id="conn" aria-live="polite">
    <div class="freq" id="freq">87.5 MHz</div>
    <div class="scale" aria-hidden="true"><i class="needle" id="needle"></i></div>
    <div class="sc-lab" aria-hidden="true"><span>88</span><span>98</span><span>108</span></div>
    <div class="meter"><b id="bar"></b></div>
    <div id="log">aguardando sintonia</div>
  </section>

  <section class="start" id="start">
    <button id="go" type="button">SINTONIZAR</button>
  </section>

  <section class="msg" id="msg" hidden aria-live="polite">
    <small id="meta"></small>
    <div id="txt"></div>
  </section>

  <nav class="dial" id="dial" hidden aria-label="Frequências"></nav>

  <section id="files" hidden></section>
  <section id="decoder" hidden>
    <div class="frags" id="frags" aria-live="polite"></div>
    <form class="row" id="form" autocomplete="off">
      <input class="in" id="code" type="text" inputmode="text" enterkeyhint="go" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="código" aria-label="Código secreto">
      <button class="val" type="submit">VALIDAR</button>
    </form>
    <section class="msg" id="dres" hidden aria-live="polite"></section>
  </section>
</main>
<nav class="nav" id="nav" aria-label="Seções"><button type="button" data-v="sinal"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><rect x="3" y="8" width="18" height="12"/><circle cx="9" cy="14" r="3"/><path d="M15 12h3M15 16h3M5 8l12-5"/></svg></i><span>RÁDIO</span></button><button type="button" data-v="arq"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/></svg></i><span>ARQUIVOS</span></button><button type="button" data-v="inv"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="M15 15l6 6"/></svg></i><span>INVESTIGAR</span></button><button type="button" data-v="dia"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square" aria-hidden="true"><rect x="5" y="3" width="14" height="18"/><path d="M9 3v18M12 8h4M12 12h4"/></svg></i><span>DIÁRIO</span></button></nav>

        (S.int>=41&&f.b2?f.b2:f.b).concat(window.ARQX&&window.ARQX[f.id]?window.ARQX[f.id](S):[]).forEach(function(t){ var q=document.createElement('p'); q.textContent=t; d2.appendChild(q); });
        p.appendChild(d2);

    });
